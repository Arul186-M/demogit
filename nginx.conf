user www-data;
worker_processes auto;
worker_cpu_affinity auto;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log;
include /etc/nginx/modules-enabled/*.conf;

events {}

http {
    server {
        listen 80;

        location /app1 {
            proxy_pass http://app1:5000/;
        }

        location /app2 {
            proxy_pass http://app2:5001/;
        }

        location /app3 {
            proxy_pass http://app3:5002/;
        }
    }
}
