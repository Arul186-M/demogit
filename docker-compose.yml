services:

  app1:
    build: ./app1
    container_name: app1

  app2:
    build: ./app2
    container_name: app2

  app3:
    build: ./app3
    container_name: app3

  nginx:
    image: nginx:latest
    container_name: nginx_proxy
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - app1
      - app2
      - app3
